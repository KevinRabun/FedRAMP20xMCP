---
pattern_id: pva.frr.frr_pva_01
name: Persistent Validation Compliance
description: Validates compliance with VDR-TFR-MVX - Persistent Validation
family: VDR
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: VDR-TFR-MVX - Persistent Validation compliance check
  description_template: Configuration requires validation for VDR-TFR-MVX compliance
  remediation_template: Implement VDR-TFR-MVX requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- ivv
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- VDR-TFR-MVX
evidence_artifacts:
- artifact_type: policy
  name: VDR-TFR-MVX policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: VDR-TFR-MVX configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated VDR-TFR-MVX compliance validation
    implementation: |
      # VDR-TFR-MVX compliance automation
      # GitHub Actions
      - name: VDR-TFR-MVX Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern pva.frr.frr_pva_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'VDR-TFR-MVX Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate VDR-TFR-MVX compliance
            az policy state list --filter "policyDefinitionName eq 'VDR-TFR-MVX'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for VDR-TFR-MVX
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "VDR-TFR-MVX"
        RequirementName = "Persistent Validation"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_VDR-TFR-MVX.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
