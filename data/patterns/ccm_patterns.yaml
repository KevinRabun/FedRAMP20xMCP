pattern_id: ccm.frr.frr_ccm_01
name: Ongoing Authorization Reports Compliance
description: Validates compliance with CCM-OCR-AVL - Ongoing Authorization Reports
family: CCM
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: CCM-OCR-AVL - Ongoing Authorization Reports compliance check
  description_template: Configuration requires validation for CCM-OCR-AVL compliance
  remediation_template: Implement CCM-OCR-AVL requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- ccm
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- CCM-OCR-AVL
evidence_artifacts:
- artifact_type: policy
  name: CCM-OCR-AVL policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: CCM-OCR-AVL configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated CCM-OCR-AVL compliance validation
    implementation: |
      # CCM-OCR-AVL compliance automation
      # GitHub Actions
      - name: CCM-OCR-AVL Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern ccm.frr.frr_ccm_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'CCM-OCR-AVL Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate CCM-OCR-AVL compliance
            az policy state list --filter "policyDefinitionName eq 'CCM-OCR-AVL'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for CCM-OCR-AVL
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "CCM-OCR-AVL"
        RequirementName = "Ongoing Authorization Reports"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_CCM-OCR-AVL.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
---
