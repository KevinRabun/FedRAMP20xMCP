---
pattern_id: fsi.frr.frr_fsi_01
name: Verified Emails Compliance
description: Validates compliance with AFC-FRP-VRE - Verified Emails
family: AFC
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: AFC-FRP-VRE - Verified Emails compliance check
  description_template: Configuration requires validation for AFC-FRP-VRE compliance
  remediation_template: Implement AFC-FRP-VRE requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- afc
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- AFC-FRP-VRE
evidence_artifacts:
- artifact_type: policy
  name: AFC-FRP-VRE policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: AFC-FRP-VRE configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated AFC-FRP-VRE compliance validation
    implementation: |
      # AFC-FRP-VRE compliance automation
      # GitHub Actions
      - name: AFC-FRP-VRE Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern fsi.frr.frr_fsi_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'AFC-FRP-VRE Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate AFC-FRP-VRE compliance
            az policy state list --filter "policyDefinitionName eq 'AFC-FRP-VRE'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for AFC-FRP-VRE
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "AFC-FRP-VRE"
        RequirementName = "Verified Emails"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_AFC-FRP-VRE.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
