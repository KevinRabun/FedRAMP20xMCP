name: Outdated Container Base Image
description: Detects old base images in Dockerfiles
family: VDR
severity: HIGH
pattern_type: configuration
languages:
  dockerfile:
    ast_queries:
    - instruction: FROM
      conditions:
      - not_contains:latest
      - not_contains:@sha256
      - tag_older_than:90_days
