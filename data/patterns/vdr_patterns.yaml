pattern_id: scn.sast.tool_integration
name: SAST Tool Integration
family: VDR
severity: critical
description: 'Detects Static Application Security Testing (SAST) tool integration.

  Persistent vulnerability detection (VDR-CSO-DET) includes automated scanning such as SAST.

  '
pattern_type: pipeline
languages:
  github_actions:
    regex_fallback: (codeql|sonarqube|snyk.*code|checkmarx)|(semgrep|bandit|brakeman|spotbugs)|(security.*code.*analysis)
  azure_pipelines:
    regex_fallback: (codeql|sonarqube|snyk.*code|checkmarx)|(semgrep|bandit|brakeman|spotbugs)|(security.*code.*analysis)
  gitlab_ci:
    regex_fallback: (codeql|sonarqube|snyk.*code|checkmarx)|(semgrep|bandit|brakeman|spotbugs)|(security.*code.*analysis)
finding:
  title: SAST tool integration detected
  description: CI/CD pipeline includes SAST scanning
  recommendation: Configure SAST to run on every commit per VDR-CSO-DET
  references:
  - VDR-CSO-DET
related_frrs:
- VDR-CSO-DET
evidence_artifacts:
- artifact_type: logs
  name: VDR operational logs
  source: Azure Monitor - Application/Resource Logs
  frequency: continuous
  retention_months: 36
  format: JSON
- artifact_type: configuration
  name: VDR configuration export
  source: Azure Portal or IaC templates
  frequency: weekly
  retention_months: 36
  format: JSON/Bicep/Terraform
- artifact_type: report
  name: VDR compliance validation report
  source: Automated testing pipeline
  frequency: daily
  retention_months: 12
  format: HTML/PDF
evidence_collection:
  azure_monitor_kql:
  - query: 'AppTraces

      | where TimeGenerated > ago(30d)

      | where Message contains "scn"

      | summarize count() by bin(TimeGenerated, 1d), SeverityLevel

      | order by TimeGenerated desc'
    description: Track VDR related operations over last 30 days
    retention_days: 730
  azure_cli:
  - command: az monitor log-analytics query --workspace $WORKSPACE_ID --analytics-query
      "AppTraces | where Message contains 'scn' | take 100"
    description: Query recent VDR events
    output_format: json
  powershell:
  - script: '# Query VDR configuration

      Get-AzSCNResource | Select-Object Name, Location, Properties'
    description: Get VDR resource configuration
automation:
  policy_enforcement:
    description: Azure Policy for VDR compliance enforcement
    implementation: "# Azure Policy definition for VDR\nresource policyDef 'Microsoft.Authorization/policyDefinitions@2021-06-01'\
      \ = {\n  name: 'scn.sast.tool_integration-policy'\n  properties: {\n    policyType:\
      \ 'Custom'\n    mode: 'All'\n    displayName: 'VDR Compliance Policy'\n    description:\
      \ 'Enforces VDR compliance requirements'\n    policyRule: {\n      if: {\n \
      \       // Add specific conditions\n      }\n      then: {\n        effect:\
      \ 'audit'\n      }\n    }\n  }\n}"
    azure_services:
    - Azure Policy
    - Azure Monitor
  continuous_monitoring:
    description: Azure Monitor alerts for VDR violations
    implementation: "resource alert 'Microsoft.Insights/metricAlerts@2018-03-01' =\
      \ {\n  name: 'scn.sast.tool_integration-alert'\n  location: 'global'\n  properties:\
      \ {\n    description: 'Alert on VDR compliance violations'\n    severity: 2\n\
      \    enabled: true\n    evaluationFrequency: 'PT5M'\n    windowSize: 'PT15M'\n\
      \  }\n}"
    azure_services:
    - Azure Monitor
    - Application Insights
  cicd_validation:
    description: CI/CD pipeline validation for VDR
    implementation: "# GitHub Actions\n- name: Validate VDR Compliance\n  run: |\n\
      \    python -m fedramp_20x_mcp.analyzers.generic_analyzer \\\n      --pattern-file\
      \ data/patterns/scn_patterns.yaml \\\n      --code-path ./src\n      \n# Azure\
      \ Pipelines  \n- task: PowerShell@2\n  displayName: 'VDR Compliance Check'\n\
      \  inputs:\n    script: |\n      # Run compliance validation\n      python validate_scn.py"
    azure_services:
    - Azure Pipelines
    - GitHub Actions
implementation:
  prerequisites:
  - Azure subscription with Contributor access
  - Required Azure services provisioned
  - VDR requirements documented and approved
  - Development and testing environment configured
  steps:
  - step: 1
    action: Review VDR FedRAMP requirements
    azure_service: null
    validation: Requirements documented and team trained
  - step: 2
    action: Design VDR implementation architecture
    azure_service: null
    validation: Architecture review completed and approved
  - step: 3
    action: Implement VDR controls in code/IaC
    azure_service: Application code and IaC
    validation: Code review completed, unit tests pass
  - step: 4
    action: Configure Azure services for VDR
    azure_service: Azure Portal
    validation: Services configured per requirements
    bicep_template: templates/bicep/scn/main.bicep
  - step: 5
    action: Set up monitoring and alerting
    azure_service: Azure Monitor
    validation: Alerts configured and tested
  - step: 6
    action: Implement automated compliance checking
    azure_service: Azure Pipelines
    validation: CI/CD pipeline validates compliance
  - step: 7
    action: Document implementation and evidence collection
    azure_service: null
    validation: Documentation complete and reviewed
  validation_queries:
  - az resource list --resource-group $RG --query "[?contains(type, 'VDR')]"
  - az monitor metrics list --resource $RESOURCE_ID
ssp_mapping:
  control_family: VDR - VDR
  control_numbers:
  - AU-2
  - AU-3
  ssp_sections:
  - section: 'AU-2: Implementation'
    description_template: The system implements VDR controls in accordance with FedRAMP
      20x requirements. VDR Requirements is addressed through a combination of Azure
      native services, application-level controls, and automated monitoring.
    implementation_details: Azure services are configured to enforce VDR compliance
      requirements. Infrastructure-as-code (Bicep/Terraform) ensures consistent deployment.
      Automated compliance checking in CI/CD pipeline validates all deployments against
      VDR requirements.
    evidence_references:
    - VDR configuration exports from Azure Portal
    - Azure Monitor logs showing compliance status
    - CI/CD pipeline validation results
    - Automated compliance scan reports
azure_guidance:
  recommended_services:
  - service: Azure Monitor
    tier: Standard
    purpose: Primary service for VDR compliance
    alternatives:
    - Alternative Azure services or third-party tools
  well_architected_framework:
    pillar: Security
    design_area: VDR implementation
    recommendation_id: SEC-01
    reference_url: https://learn.microsoft.com/azure/well-architected/security/
  cloud_adoption_framework:
    stage: Secure
    guidance: Implement VDR controls as part of secure baseline
    reference_url: https://learn.microsoft.com/azure/cloud-adoption-framework/secure/
compliance_frameworks:
  fedramp_20x:
    requirement_id: VDR-CSO-DET
    requirement_name: Vulnerability Detection
    impact_levels:
    - Low
    - Moderate
testing:
  positive_test_cases:
  - description: Compliant github_actions code sample
    code_sample: '# github_actions code that meets requirements

