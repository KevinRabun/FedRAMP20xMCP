pattern_id: vdr.scanning.missing_container_scan
name: Missing Container Image Scanning
description: Detects container builds without vulnerability scanning
family: VDR
severity: CRITICAL
pattern_type: pipeline
languages:
  github_actions:
    ast_queries:
    - workflow_step: uses
      action: docker/build-push-action
      conditions:
      - not_followed_by:aquasecurity/trivy-action|anchore/scan-action
    regex_fallback: docker/build-push-action
    negative_indicators:
    - trivy
    - anchore
    - snyk container
  azure_pipelines:
    ast_queries:
    - task_type: Docker@2
      conditions:
      - command:buildAndPush
      - not_followed_by:AquaScan|Snyk
    regex_fallback: Docker@2.*buildAndPush
finding:
  title_template: Container image built without vulnerability scan
  description_template: Docker image built without scanning. VDR-CSO-DET requires container vulnerability scanning before deployment.
  remediation_template: "Add container scanning:\n\nGitHub Actions:\n- name: Run Trivy vulnerability scanner\n  uses: aquasecurity/trivy-action@master\n  with:\n    image-ref: 'myapp:${{ github.sha }}'\n    format: 'sarif'\n    output: 'trivy-results.sarif'\n    severity: 'CRITICAL,HIGH'\n    exit-code: '1'  # Fail on vulnerabilities\n"
