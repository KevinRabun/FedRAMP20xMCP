  positive_test_cases:
  - description: Compliant dockerfile implementation of vdr.patching.outdated_base_image
    code_sample: '# Dockerfile with pinned base image using SHA256 digest

      FROM python:3.12-slim@sha256:2be8daddbb82756f7d1f2c7ece706aadcb284bf6ab6d769ea695cc3ed6016743


      WORKDIR /app

      COPY requirements.txt .

