description: Detects CI/CD pipelines without SAST
family: VDR
severity: CRITICAL
pattern_type: pipeline
languages:
  github_actions:
    ast_queries:
    - workflow_file: '*.yml'
      conditions:
      - has_job:build|test
      - not_contains:codeql|semgrep|snyk
    regex_fallback: on:\s*(push|pull_request)
    negative_indicators:
    - codeql
    - semgrep
    - snyk
    - sonarqube
