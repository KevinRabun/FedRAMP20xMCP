    negative_indicators:
    - latest
    - '@sha256'
finding:
  title_template: Outdated container base image
  description_template: Base image may contain known vulnerabilities. VDR-CSO-RES requires regular patching (90 days max).
  remediation_template: 'Update base image:

    - Use specific version tags, not ''latest''

    - Pin with SHA256 digest for reproducibility

    - Automate base image updates in CI/CD

    - Example: FROM python:3.11-slim@sha256:abc123...

    '
