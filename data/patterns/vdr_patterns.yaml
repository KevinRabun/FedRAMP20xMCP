pattern_id: vdr.dependencies.outdated_packages
name: Outdated Dependencies
description: Detects outdated dependencies with known CVEs
family: VDR
severity: VARIES
pattern_type: configuration
languages:
  python:
    file_path: requirements.txt|Pipfile|pyproject.toml
    ast_queries:
    - package_with_cve: true
    - package_age: '>6_months'
    regex_fallback: ^[a-zA-Z0-9_-]+==.*$
    positive_indicators:
    - dependencies
    - version
    - requirements.txt
    negative_indicators:
    - pip-audit
    - renovate
    - dependabot
  typescript:
    file_path: package.json
    ast_queries:
    - json_path: dependencies.*
      conditions:
      - has_known_cve
    regex_fallback: '"dependencies":\s*\{'
    positive_indicators:
    - dependencies
    - version
    - package.json
    negative_indicators:
    - npm-check-updates
    - renovate
    - dependabot
  javascript:
    file_path: package.json
    ast_queries:
    - json_path: dependencies.*
      conditions:
      - has_known_cve
    regex_fallback: '"dependencies":\s*\{'
  csharp:
    file_path: '*.csproj|packages.config'
    ast_queries:
    - xml_path: PackageReference[@Include]
      conditions:
      - has_known_cve
    regex_fallback: <PackageReference
    positive_indicators:
    - PackageReference
    - Version=
    - packages
    negative_indicators:
    - DependencyCheck
    - renovate
    - dependabot
  java:
    file_path: pom.xml|build.gradle
    ast_queries:
    - xml_path: dependencies/dependency
      conditions:
      - has_known_cve
    regex_fallback: <dependency>|dependencies \{
    positive_indicators:
    - dependency
    - version
    - pom.xml
    negative_indicators:
    - owasp-dependency-check
    - renovate
    - dependabot
