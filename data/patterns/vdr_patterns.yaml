pattern_id: vdr.scanning.defender_for_cloud
name: Microsoft Defender for Cloud
description: Detects Defender for Cloud enablement in IaC
family: VDR
severity: INFO
pattern_type: resource
languages:
  bicep:
    ast_queries:
    - resource_type: Microsoft.Security/pricings
      property_path: properties.pricingTier
      value: Standard
    regex_fallback: Microsoft\.Security/pricings
    positive_indicators:
    - Microsoft.Security/pricings
    - Standard
  terraform:
    ast_queries:
    - resource_type: azurerm_security_center_subscription_pricing
      attribute: tier
      value: Standard
    regex_fallback: azurerm_security_center_subscription_pricing
finding:
  title_template: Microsoft Defender for Cloud enabled
  description_template: Defender for Cloud configured at Standard tier. Verify all workload protection plans are enabled.
  remediation_template: 'Required Defender plans for FedRAMP:

    - Virtual Machines

    - Storage

    - SQL Databases

    - App Services

    - Key Vault

    - Resource Manager

    - DNS

    - Containers

    '
tags:
- vulnerability-scanning
- defender
- positive
nist_controls:
- ra-5
- si-2
related_ksis:
- VDR-CSO-DET
- VDR-CSO-ADT
azure_services:
- Microsoft Defender for Cloud
ssp_mapping:
  control_family: RA - Risk Assessment
  control_numbers:
  - RA-5
  - SI-2
  ssp_sections:
  - section: 'RA-5: Unknown'
    description_template: The system implements Unknown Requirement controls in accordance with FedRAMP 20x requirements. Requirement statement not available... Implementation leverages Azure native services combined with application-level controls and automated monitoring to ensure continuous compliance.
    implementation_details: Azure services including Azure Monitor are configured to enforce compliance requirements. Infrastructure-as-code (Bicep/Terraform) templates ensure consistent deployment across environments. Automated compliance checking in CI/CD pipelines validates all changes against Unknown Requirement requirements before deployment.
    evidence_references:
    - Configuration exports
    - Compliance reports
compliance_frameworks:
  fedramp_20x:
    requirement_id: VDR-CSO-DET
    requirement_name: Vulnerability Detection and Response
    impact_levels:
    - Low
    - Moderate
testing:
  positive_test_cases:
  - description: Compliant bicep implementation of vdr.scanning.defender_for_cloud
    code_sample: "// Bicep compliant configuration for vdr.scanning.defender_for_cloud\nresource compliantResource 'Microsoft.Resources/example@2021-01-01' = {\n  name: 'compliant-resource'\n  properties: {\n    // Compliant configuration\n  }\n}"
    expected_severity: INFO
    expected_finding: true
  negative_test_cases:
  - description: Non-compliant bicep code violating vdr.scanning.defender_for_cloud
    code_sample: '# Non-compliant code missing vdr.scanning.defender_for_cloud requirements'
    expected_severity: HIGH
    expected_finding: true
  validation_scripts: []
evidence_artifacts:
- artifact_type: configuration
  name: Configuration compliance evidence
  source: Azure Resource Graph
  frequency: daily
  retention_months: 36
  format: JSON
- artifact_type: logs
  name: Compliance audit logs
  source: Azure Monitor
  frequency: daily
  retention_months: 36
  format: JSON
- artifact_type: report
  name: Compliance assessment report
  source: Microsoft Defender for Cloud
  frequency: weekly
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Azure Policy for compliance enforcement
    implementation: "# Azure Policy enforcement\n# GitHub Actions\n- name: Compliance Check\n  run: |\n    python -m fedramp_20x_mcp.analyzers.generic_analyzer \\\n      --pattern vdr.scanning.defender_for_cloud \\\n      --code-path ./src\n\n# Azure Pipelines\n- task: PowerShell@2\n  displayName: 'Compliance Validation'\n  inputs:\n    script: |\n      # Validate compliance\n      python validate.py --pattern vdr.scanning.defender_for_cloud\n"
    azure_services:
    - Azure Policy
    - Azure Monitor
    - Microsoft Defender for Cloud
  automation_2:
    description: Continuous monitoring and alerting
    implementation: '# Azure Monitor continuous monitoring

      # Log Analytics Query

      AzureActivity

      | where CategoryValue == "Policy" or CategoryValue == "Security"

      | where ResourceId contains "vdr.scanning.defender_for_cloud"

      | project TimeGenerated, ResourceId, OperationName, ActivityStatusValue

      '
    azure_services:
    - Azure Monitor
    - Log Analytics
    - Azure Alerts
---
pattern_id: vdr.scanning.ci_cd_scanning
name: CI/CD Security Scanning
description: Detects security scanning in CI/CD pipelines
family: VDR
severity: HIGH
pattern_type: pipeline
languages:
  github_actions:
    ast_queries:
    - workflow_step: uses
      actions:
      - github/codeql-action
      - anchore/scan-action
      - aquasecurity/trivy-action
      - snyk/actions
    regex_fallback: uses:.*codeql|uses:.*trivy|uses:.*snyk
    positive_indicators:
    - codeql
    - trivy
    - snyk
    - aquasec
  azure_pipelines:
    ast_queries:
    - task_type: Snyk@1|WhiteSource@21|SonarQube@5
    regex_fallback: task:\s*(Snyk|WhiteSource|SonarQube)
  gitlab_ci:
    ast_queries:
    - job_name: sast|dependency_scanning|container_scanning
    regex_fallback: 'sast:|dependency_scanning:|container_scanning:'
finding:
  title_template: Security scanning in CI/CD pipeline
  description_template: Automated vulnerability scanning detected in pipeline. Verify scans run on every commit.
  remediation_template: N/A - Positive finding. Ensure scan results fail builds for HIGH/CRITICAL vulnerabilities.
tags:
- ci-cd
- vulnerability-scanning
- positive
nist_controls:
- ra-5
- si-2
related_ksis:
- VDR-CSO-DET
