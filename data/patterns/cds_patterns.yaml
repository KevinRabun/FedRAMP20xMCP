pattern_id: ads.machine_readable.json_export
name: JSON Export for Audit Data
family: CDS
severity: high
description: 'Detects JSON serialization of audit data for machine-readable format
  compliance.

  CDS-CSO-PUB requires certification data to be shared in human-readable and JSON formats.

  '
pattern_type: function_call
languages:
  python:
    ast_queries: &id001
    - query_type: function_call
      target: json.dumps
    - query_type: function_call
      target: JsonSerializer.Serialize
    - query_type: function_call
      target: JSON.stringify
    - query_type: function_call
      target: ObjectMapper
    regex_fallback: (json\.dumps\()|(JsonSerializer\.Serialize)|(JSON\.stringify)
  csharp:
    ast_queries: *id001
    regex_fallback: (json\.dumps\()|(JsonSerializer\.Serialize)|(JSON\.stringify)
  java:
    ast_queries: *id001
    regex_fallback: (json\.dumps\()|(JsonSerializer\.Serialize)|(JSON\.stringify)
  typescript:
    ast_queries: *id001
    regex_fallback: (json\.dumps\()|(JsonSerializer\.Serialize)|(JSON\.stringify)
finding:
  title: JSON export detected for audit data
  description: Code exports data in JSON format for machine-readable compliance
  recommendation: Ensure this export includes all required audit fields per CDS-CSO-PUB
  references:
  - CDS-CSO-PUB
  - CDS-CSO-CBF
related_frrs:
- CDS-CSO-PUB
- CDS-CSO-CBF
evidence_artifacts:
- artifact_type: logs
  name: CDS operational logs
  source: Azure Monitor - Application/Resource Logs
  frequency: continuous
  retention_months: 36
  format: JSON
- artifact_type: configuration
  name: CDS configuration export
  source: Azure Portal or IaC templates
  frequency: weekly
  retention_months: 36
  format: JSON/Bicep/Terraform
- artifact_type: report
  name: CDS compliance validation report
  source: Automated testing pipeline
  frequency: daily
  retention_months: 12
  format: HTML/PDF
evidence_collection:
  azure_monitor_kql:
  - query: 'AppTraces

      | where TimeGenerated > ago(30d)

      | where Message contains "cds"

      | summarize count() by bin(TimeGenerated, 1d), SeverityLevel

      | order by TimeGenerated desc'
    description: Track CDS related operations over last 30 days
    retention_days: 730
  azure_cli:
  - command: az monitor log-analytics query --workspace $WORKSPACE_ID --analytics-query
      "AppTraces | where Message contains 'cds' | take 100"
    description: Query recent CDS events
    output_format: json
  powershell:
  - script: '# Query CDS configuration

      Get-AzADSResource | Select-Object Name, Location, Properties'
    description: Get CDS resource configuration
automation:
  policy_enforcement:
    description: Azure Policy for CDS compliance enforcement
    implementation: "# Azure Policy definition for CDS\nresource policyDef 'Microsoft.Authorization/policyDefinitions@2021-06-01'\
      \ = {\n  name: 'ads.machine_readable.json_export-policy'\n  properties: {\n\
      \    policyType: 'Custom'\n    mode: 'All'\n    displayName: 'CDS Compliance\
      \ Policy'\n    description: 'Enforces CDS compliance requirements'\n    policyRule:\
      \ {\n      if: {\n        // Add specific conditions\n      }\n      then: {\n\
      \        effect: 'audit'\n      }\n    }\n  }\n}"
    azure_services:
    - Azure Policy
    - Azure Monitor
  continuous_monitoring:
    description: Azure Monitor alerts for CDS violations
    implementation: "resource alert 'Microsoft.Insights/metricAlerts@2018-03-01' =\
      \ {\n  name: 'ads.machine_readable.json_export-alert'\n  location: 'global'\n\
      \  properties: {\n    description: 'Alert on CDS compliance violations'\n  \
      \  severity: 2\n    enabled: true\n    evaluationFrequency: 'PT5M'\n    windowSize:\
      \ 'PT15M'\n  }\n}"
    azure_services:
    - Azure Monitor
    - Application Insights
  cicd_validation:
    description: CI/CD pipeline validation for CDS
    implementation: "# GitHub Actions\n- name: Validate CDS Compliance\n  run: |\n\
      \    python -m fedramp_20x_mcp.analyzers.generic_analyzer \\\n      --pattern-file\
      \ data/patterns/ads_patterns.yaml \\\n      --code-path ./src\n      \n# Azure\
      \ Pipelines  \n- task: PowerShell@2\n  displayName: 'CDS Compliance Check'\n\
      \  inputs:\n    script: |\n      # Run compliance validation\n      python validate_ads.py"
    azure_services:
    - Azure Pipelines
    - GitHub Actions
implementation:
  prerequisites:
  - Azure subscription with Contributor access
  - Required Azure services provisioned
  - CDS requirements documented and approved
  - Development and testing environment configured
  steps:
  - step: 1
    action: Review CDS FedRAMP requirements
    azure_service: null
    validation: Requirements documented and team trained
  - step: 2
    action: Design CDS implementation architecture
    azure_service: null
    validation: Architecture review completed and approved
  - step: 3
    action: Implement CDS controls in code/IaC
    azure_service: Application code and IaC
    validation: Code review completed, unit tests pass
  - step: 4
    action: Configure Azure services for CDS
    azure_service: Azure Portal
    validation: Services configured per requirements
    bicep_template: templates/bicep/ads/main.bicep
  - step: 5
    action: Set up monitoring and alerting
    azure_service: Azure Monitor
    validation: Alerts configured and tested
  - step: 6
    action: Implement automated compliance checking
    azure_service: Azure Pipelines
    validation: CI/CD pipeline validates compliance
  - step: 7
    action: Document implementation and evidence collection
    azure_service: null
    validation: Documentation complete and reviewed
  validation_queries:
  - az resource list --resource-group $RG --query "[?contains(type, 'CDS')]"
  - az monitor metrics list --resource $RESOURCE_ID
ssp_mapping:
  control_family: CDS - CDS
  control_numbers:
  - AU-2
  - AU-3
  ssp_sections:
  - section: 'AU-2: Implementation'
    description_template: The system implements CDS controls in accordance with FedRAMP
      20x requirements. CDS Requirements is addressed through a combination of Azure
      native services, application-level controls, and automated monitoring.
    implementation_details: Azure services are configured to enforce CDS compliance
      requirements. Infrastructure-as-code (Bicep/Terraform) ensures consistent deployment.
      Automated compliance checking in CI/CD pipeline validates all deployments against
      CDS requirements.
    evidence_references:
    - CDS configuration exports from Azure Portal
    - Azure Monitor logs showing compliance status
    - CI/CD pipeline validation results
    - Automated compliance scan reports
azure_guidance:
  recommended_services:
  - service: Azure Monitor
    tier: Standard
    purpose: Primary service for CDS compliance
    alternatives:
    - Alternative Azure services or third-party tools
  well_architected_framework:
    pillar: Security
    design_area: CDS implementation
    recommendation_id: SEC-01
    reference_url: https://learn.microsoft.com/azure/well-architected/security/
  cloud_adoption_framework:
    stage: Secure
    guidance: Implement CDS controls as part of secure baseline
    reference_url: https://learn.microsoft.com/azure/cloud-adoption-framework/secure/
compliance_frameworks:
  fedramp_20x:
    requirement_id: CDS-CSO-PUB
    requirement_name: Public Information
    impact_levels:
    - Low
    - Moderate
testing:
  positive_test_cases:
  - description: Compliant python code sample
    code_sample: '# python code that meets requirements

      # Add specific example'
    expected_severity: INFO
    expected_finding: true
  negative_test_cases:
  - description: Non-compliant python code
    code_sample: '# python code that violates requirements

      # Add specific example'
    expected_severity: HIGH
    expected_finding: true
  validation_scripts:
  - tests/test_ads_patterns.py::test_ads_machine_readable_json_export
