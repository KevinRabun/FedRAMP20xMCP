    - query_type: decorator
      target: '@api.route'
    - query_type: decorator
      target: '[HttpGet]'
    - query_type: decorator
      target: '@GetMapping'
    regex_fallback: (@app\.route.*audit|@api\.route.*audit)|(\[HttpGet.*Audit\])|(@GetMapping.*audit)
  csharp:
