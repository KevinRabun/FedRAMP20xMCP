name: Public Information Compliance
description: Validates compliance with CDS-CSO-PUB - Public Information
family: CDS
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: CDS-CSO-PUB - Public Information compliance check
  description_template: Configuration requires validation for CDS-CSO-PUB compliance
  remediation_template: Implement CDS-CSO-PUB requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- cds
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- CDS-CSO-PUB
evidence_artifacts:
- artifact_type: policy
  name: CDS-CSO-PUB policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: CDS-CSO-PUB configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated CDS-CSO-PUB compliance validation
    implementation: |
      # CDS-CSO-PUB compliance automation
      # GitHub Actions
      - name: CDS-CSO-PUB Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern ads.frr.frr_ads_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'CDS-CSO-PUB Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate CDS-CSO-PUB compliance
            az policy state list --filter "policyDefinitionName eq 'CDS-CSO-PUB'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for CDS-CSO-PUB
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
