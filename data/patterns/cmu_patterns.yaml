pattern_id: ucm.frr.frr_ucm_01
name: Cryptographic Module Documentation Compliance
description: Validates compliance with CMU-CSO-CMD - Cryptographic Module Documentation
family: CMU
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: CMU-CSO-CMD - Cryptographic Module Documentation compliance check
  description_template: Configuration requires validation for CMU-CSO-CMD compliance
  remediation_template: Implement CMU-CSO-CMD requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- cmu
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- CMU-CSO-CMD
evidence_artifacts:
- artifact_type: policy
  name: CMU-CSO-CMD policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: CMU-CSO-CMD configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated CMU-CSO-CMD compliance validation
    implementation: |
      # CMU-CSO-CMD compliance automation
      # GitHub Actions
      - name: CMU-CSO-CMD Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern ucm.frr.frr_ucm_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'CMU-CSO-CMD Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate CMU-CSO-CMD compliance
            az policy state list --filter "policyDefinitionName eq 'CMU-CSO-CMD'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for CMU-CSO-CMD
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "CMU-CSO-CMD"
        RequirementName = "Cryptographic Module Documentation"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_CMU-CSO-CMD.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
---
