---
pattern_id: icp.frr.frr_icp_01
name: Incident Reporting to FedRAMP Compliance
description: Validates compliance with IEC-CSO-IIR - Incident Reporting to FedRAMP
family: IEC
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: IEC-CSO-IIR - Incident Reporting to FedRAMP compliance check
  description_template: Configuration requires validation for IEC-CSO-IIR compliance
  remediation_template: Implement IEC-CSO-IIR requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- iec
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- IEC-CSO-IIR
evidence_artifacts:
- artifact_type: policy
  name: IEC-CSO-IIR policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: IEC-CSO-IIR configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated IEC-CSO-IIR compliance validation
    implementation: |
      # IEC-CSO-IIR compliance automation
      # GitHub Actions
      - name: IEC-CSO-IIR Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern icp.frr.frr_icp_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'IEC-CSO-IIR Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate IEC-CSO-IIR compliance
            az policy state list --filter "policyDefinitionName eq 'IEC-CSO-IIR'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for IEC-CSO-IIR
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "IEC-CSO-IIR"
        RequirementName = "Incident Reporting to FedRAMP"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_IEC-CSO-IIR.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
---
