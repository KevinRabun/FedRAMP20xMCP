pattern_id: ucm.rbac.role_definition
name: Role-Based Access Control Definition
family: IAM
severity: high
description: 'Detects RBAC role definitions for user capability management.

  Well-defined roles with least privilege (KSI-IAM-ELP) limit access to cryptographic modules and keys.

  '
pattern_type: configuration
languages:
  python:
    regex_fallback: (class.*Role|enum.*Role|ROLES\s*=)|(role.*admin|role.*user|role.*viewer)|(@role|@roles|@authorize)
  csharp:
    regex_fallback: (class.*Role|enum.*Role|ROLES\s*=)|(role.*admin|role.*user|role.*viewer)|(@role|@roles|@authorize)
  java:
    regex_fallback: (class.*Role|enum.*Role|ROLES\s*=)|(role.*admin|role.*user|role.*viewer)|(@role|@roles|@authorize)
  typescript:
    regex_fallback: (class.*Role|enum.*Role|ROLES\s*=)|(role.*admin|role.*user|role.*viewer)|(@role|@roles|@authorize)
finding:
  title: RBAC role definition detected
  description: Code defines roles for user capability management
  recommendation: Ensure roles follow least privilege principle per KSI-IAM-ELP
  references:
  - KSI-IAM-ELP
related_ksis:
- KSI-IAM-ELP
evidence_artifacts:
- artifact_type: logs
  name: IAM operational logs
  source: Azure Monitor - Application/Resource Logs
  frequency: continuous
  retention_months: 36
  format: JSON
- artifact_type: configuration
  name: IAM configuration export
  source: Azure Portal or IaC templates
  frequency: weekly
  retention_months: 36
  format: JSON/Bicep/Terraform
- artifact_type: report
  name: IAM compliance validation report
  source: Automated testing pipeline
  frequency: daily
  retention_months: 12
  format: HTML/PDF
evidence_collection:
  azure_monitor_kql:
  - query: 'AppTraces

      | where TimeGenerated > ago(30d)

      | where Message contains "iam"

      | summarize count() by bin(TimeGenerated, 1d), SeverityLevel

      | order by TimeGenerated desc'
    description: Track IAM related operations over last 30 days
    retention_days: 730
  azure_cli:
  - command: az monitor log-analytics query --workspace $WORKSPACE_ID --analytics-query
      "AppTraces | where Message contains 'iam' | take 100"
    description: Query recent IAM events
    output_format: json
  powershell:
  - script: '# Query IAM configuration

      Get-AzUCMResource | Select-Object Name, Location, Properties'
    description: Get IAM resource configuration
automation:
  policy_enforcement:
    description: Azure Policy for IAM compliance enforcement
    implementation: "# Azure Policy definition for IAM\nresource policyDef 'Microsoft.Authorization/policyDefinitions@2021-06-01'\
      \ = {\n  name: 'ucm.rbac.role_definition-policy'\n  properties: {\n    policyType:\
      \ 'Custom'\n    mode: 'All'\n    displayName: 'IAM Compliance Policy'\n    description:\
      \ 'Enforces IAM compliance requirements'\n    policyRule: {\n      if: {\n \
      \       // Add specific conditions\n      }\n      then: {\n        effect:\
      \ 'audit'\n      }\n    }\n  }\n}"
    azure_services:
    - Azure Policy
    - Azure Monitor
  continuous_monitoring:
    description: Azure Monitor alerts for IAM violations
    implementation: "resource alert 'Microsoft.Insights/metricAlerts@2018-03-01' =\
      \ {\n  name: 'ucm.rbac.role_definition-alert'\n  location: 'global'\n  properties:\
      \ {\n    description: 'Alert on IAM compliance violations'\n    severity: 2\n\
      \    enabled: true\n    evaluationFrequency: 'PT5M'\n    windowSize: 'PT15M'\n\
      \  }\n}"
    azure_services:
    - Azure Monitor
    - Application Insights
  cicd_validation:
    description: CI/CD pipeline validation for IAM
    implementation: "# GitHub Actions\n- name: Validate IAM Compliance\n  run: |\n\
      \    python -m fedramp_20x_mcp.analyzers.generic_analyzer \\\n      --pattern-file\
      \ data/patterns/ucm_patterns.yaml \\\n      --code-path ./src\n      \n# Azure\
      \ Pipelines  \n- task: PowerShell@2\n  displayName: 'IAM Compliance Check'\n\
      \  inputs:\n    script: |\n      # Run compliance validation\n      python validate_ucm.py"
    azure_services:
    - Azure Pipelines
    - GitHub Actions
implementation:
  prerequisites:
  - Azure subscription with Contributor access
  - Required Azure services provisioned
  - IAM requirements documented and approved
  - Development and testing environment configured
  steps:
  - step: 1
    action: Review IAM FedRAMP requirements
    azure_service: null
    validation: Requirements documented and team trained
  - step: 2
    action: Design IAM implementation architecture
    azure_service: null
    validation: Architecture review completed and approved
  - step: 3
    action: Implement IAM controls in code/IaC
    azure_service: Application code and IaC
    validation: Code review completed, unit tests pass
  - step: 4
    action: Configure Azure services for IAM
    azure_service: Azure Portal
    validation: Services configured per requirements
    bicep_template: templates/bicep/ucm/main.bicep
  - step: 5
    action: Set up monitoring and alerting
    azure_service: Azure Monitor
    validation: Alerts configured and tested
  - step: 6
    action: Implement automated compliance checking
    azure_service: Azure Pipelines
    validation: CI/CD pipeline validates compliance
  - step: 7
