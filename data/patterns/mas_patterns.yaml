---
pattern_id: mas.frr.frr_mas_01
name: Cloud Service Offering Identification Compliance
description: Validates compliance with MAS-CSO-IIR - Cloud Service Offering Identification
family: MAS
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: MAS-CSO-IIR - Cloud Service Offering Identification compliance check
  description_template: Configuration requires validation for MAS-CSO-IIR compliance
  remediation_template: Implement MAS-CSO-IIR requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- mas
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- MAS-CSO-IIR
evidence_artifacts:
- artifact_type: policy
  name: MAS-CSO-IIR policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: MAS-CSO-IIR configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated MAS-CSO-IIR compliance validation
    implementation: |
      # MAS-CSO-IIR compliance automation
      # GitHub Actions
      - name: MAS-CSO-IIR Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern mas.frr.frr_mas_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'MAS-CSO-IIR Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate MAS-CSO-IIR compliance
            az policy state list --filter "policyDefinitionName eq 'MAS-CSO-IIR'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for MAS-CSO-IIR
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "MAS-CSO-IIR"
        RequirementName = "Cloud Service Offering Identification"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_MAS-CSO-IIR.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
