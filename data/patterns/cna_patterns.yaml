pattern_id: rsc.missing_resource_limits
name: Missing Resource Limits
family: CNA
severity: critical
description: Detects absence of resource limit configuration
pattern_type: configuration
languages:
  yaml: {}
requires_absence:
- rsc.allocation.resource_limits
finding:
  title: No resource limits configured
  description: Configuration lacks resource limits (CPU, memory)
  severity: critical
  recommendation: Add resource limits to prevent resource exhaustion per KSI-CNA-OFA
  references:
  - KSI-CNA-OFA
related_ksis:
- KSI-CNA-OFA
evidence_artifacts:
- artifact_type: logs
  name: CNA operational logs
  source: Azure Monitor - Application/Resource Logs
  frequency: continuous
  retention_months: 36
  format: JSON
- artifact_type: configuration
  name: CNA configuration export
  source: Azure Portal or IaC templates
  frequency: weekly
  retention_months: 36
  format: JSON/Bicep/Terraform
- artifact_type: report
  name: CNA compliance validation report
  source: Automated testing pipeline
  frequency: daily
  retention_months: 12
  format: HTML/PDF
evidence_collection:
  azure_monitor_kql:
  - query: 'AppTraces

      | where TimeGenerated > ago(30d)

      | where Message contains "cna"

      | summarize count() by bin(TimeGenerated, 1d), SeverityLevel

      | order by TimeGenerated desc'
    description: Track CNA related operations over last 30 days
    retention_days: 730
  azure_cli:
  - command: az monitor log-analytics query --workspace $WORKSPACE_ID --analytics-query
      "AppTraces | where Message contains 'cna' | take 100"
    description: Query recent CNA events
    output_format: json
  powershell:
  - script: '# Query CNA configuration

