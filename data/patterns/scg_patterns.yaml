pattern_id: rsc.frr.frr_rsc_01
name: Top-Level Administrative Accounts Guidance Compliance
description: Validates compliance with SCG-CSO-RSC - Top-Level Administrative Accounts Guidance
family: SCG
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: SCG-CSO-RSC - Top-Level Administrative Accounts Guidance compliance check
  description_template: Configuration requires validation for SCG-CSO-RSC compliance
  remediation_template: Implement SCG-CSO-RSC requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- scg
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- SCG-CSO-RSC
evidence_artifacts:
- artifact_type: policy
  name: SCG-CSO-RSC policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: SCG-CSO-RSC configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated SCG-CSO-RSC compliance validation
    implementation: |
      # SCG-CSO-RSC compliance automation
      # GitHub Actions
      - name: SCG-CSO-RSC Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern rsc.frr.frr_rsc_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'SCG-CSO-RSC Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate SCG-CSO-RSC compliance
            az policy state list --filter "policyDefinitionName eq 'SCG-CSO-RSC'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for SCG-CSO-RSC
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "SCG-CSO-RSC"
        RequirementName = "Top-Level Administrative Accounts Guidance"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_SCG-CSO-RSC.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
---
