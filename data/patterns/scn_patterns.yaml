pattern_id: scn.frr.frr_scn_01
name: Notifications Compliance
description: Validates compliance with SCN-CSO-EVA - Notifications
family: SCN
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: SCN-CSO-EVA - Notifications compliance check
  description_template: Configuration requires validation for SCN-CSO-EVA compliance
  remediation_template: Implement SCN-CSO-EVA requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- scn
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- SCN-CSO-EVA
evidence_artifacts:
- artifact_type: policy
  name: SCN-CSO-EVA policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: SCN-CSO-EVA configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated SCN-CSO-EVA compliance validation
    implementation: |
      # SCN-CSO-EVA compliance automation
      # GitHub Actions
      - name: SCN-CSO-EVA Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern scn.frr.frr_scn_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'SCN-CSO-EVA Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate SCN-CSO-EVA compliance
            az policy state list --filter "policyDefinitionName eq 'SCN-CSO-EVA'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for SCN-CSO-EVA
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "SCN-CSO-EVA"
        RequirementName = "Notifications"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_SCN-CSO-EVA.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate', 'High']
---
