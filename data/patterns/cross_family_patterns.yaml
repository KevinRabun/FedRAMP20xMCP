pattern_id: ksi.frr.frr_ksi_01
name: Application of Key Security Indicators Compliance
description: Validates compliance with FRC-CSX-MAS - Application of Key Security Indicators
family: FRC
severity: MEDIUM
pattern_type: compliance
languages:
  bicep:
    regex_fallback: ".*"
  terraform:
    regex_fallback: ".*"
finding:
  title_template: FRC-CSX-MAS - Application of Key Security Indicators compliance check
  description_template: Configuration requires validation for FRC-CSX-MAS compliance
  remediation_template: Implement FRC-CSX-MAS requirements per FedRAMP 20x documentation
  evidence_collection:
  - Compliance documentation
  - Policy artifacts
  - Configuration evidence
  azure_services:
  - Azure Policy
  - Microsoft Defender for Cloud
tags:
- ksi
- frr
- compliance
nist_controls:
- fedramp-20x
related_frrs:
- FRC-CSX-MAS
evidence_artifacts:
- artifact_type: policy
  name: FRC-CSX-MAS policy documentation
  source: Azure DevOps
  frequency: monthly
  retention_months: 84
  format: PDF
- artifact_type: configuration
  name: FRC-CSX-MAS configuration evidence
  source: Azure Resource Manager
  frequency: daily
  retention_months: 36
  format: JSON
automation:
  automation_1:
    description: Automated FRC-CSX-MAS compliance validation
    implementation: |
      # FRC-CSX-MAS compliance automation
      # GitHub Actions
      - name: FRC-CSX-MAS Validation
        run: |
          python -m fedramp_20x_mcp.analyzers.generic_analyzer \
            --pattern ksi.frr.frr_ksi_01 \
            --code-path ./src
      
      # Azure Pipelines
      - task: AzureCLI@2
        displayName: 'FRC-CSX-MAS Check'
        inputs:
          azureSubscription: 'AzureConnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            # Validate FRC-CSX-MAS compliance
            az policy state list --filter "policyDefinitionName eq 'FRC-CSX-MAS'"
    azure_services:
    - Azure Policy
    - Azure CLI
    - Azure DevOps
  automation_2:
    description: Evidence collection for FRC-CSX-MAS
    implementation: |
      # Automated evidence collection
      # PowerShell script
      $evidence = @{
        RequirementId = "FRC-CSX-MAS"
        RequirementName = "Application of Key Security Indicators"
        CollectionDate = Get-Date -Format "yyyy-MM-dd"
        ComplianceStatus = "To Be Determined"
      }
      $evidence | ConvertTo-Json | Out-File -FilePath "evidence_FRC-CSX-MAS.json"
    azure_services:
    - Azure Automation
    - Azure Storage
impact_levels: ['Low', 'Moderate']
---
