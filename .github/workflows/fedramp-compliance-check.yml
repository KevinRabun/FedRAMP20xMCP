name: FedRAMP 20x Compliance Check

# Runs fedramp-20x-scan (the MCP server's pattern engine, no MCP client
# needed) against the FedRAMP Consolidated Rules for 2026 and publishes
# findings.json, report.md and run.json (rules version + sha256).
#
# Evidence storage: GitHub-hosted runners cannot reach a private-endpoint
# evidence account. Store evidence from Azure DevOps instead
# (.azuredevops/fedramp-compliance-pipeline.yml), or download this artifact
# and use examples/azure_evidence_store.py from a host on that network.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Fail on issues at or above'
        default: 'high'
        type: choice
        options: [critical, high, medium, low, none]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: FedRAMP 20x pattern scan
        id: scan
        run: |
          set +e
          fedramp-20x-scan . \
            --output-dir fedramp-scan \
            --fail-on "${{ inputs.fail_on || 'high' }}" \
            --exclude 'tests/*' \
            --exclude 'src/fedramp_20x_mcp/templates/*' \
            --exclude 'examples/*'
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat fedramp-scan/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$rc" -ge 2 ] && exit "$rc"
          exit 0

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedramp-scan
          path: fedramp-scan/

      - name: Enforce gate
        if: steps.scan.outputs.rc == '1'
        run: |
          echo "::error::FedRAMP 20x gate failed; see the job summary or the fedramp-scan artifact."
          exit 1
