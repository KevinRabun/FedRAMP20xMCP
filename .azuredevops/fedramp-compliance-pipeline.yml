# FedRAMP 20x compliance scan for this repository, with evidence storage.
#
# Stage Scan (Microsoft-hosted): runs fedramp-20x-scan over the repo against
#   the FedRAMP Consolidated Rules for 2026 and publishes findings.json,
#   report.md and run.json. The gate (failOn) is enforced after publishing, so
#   a failing scan still produces its report.
# Stage StoreEvidence (self-hosted, private network): uploads the scan output
#   to the WORM evidence account. Runs for scheduled, manual and CI runs, not
#   for pull requests (a PR scan is review feedback, not compliance evidence),
#   and also when the scan gate failed, because a failing result is evidence too.
#
# To scan another repository, use the same two templates from that
# repository's pipeline: examples/azure-devops/scan-and-store-evidence.yml.
#
# Evidence storage defaults are IntelliGRC's (see
# templates/evidence-upload-steps.yml). Only an IntelliGRC-project pipeline may
# run with uploadEvidence true.

trigger:
  branches:
    include: [main]
  paths:
    exclude: ['*.md', 'docs/*']

pr:
  branches:
    include: [main]

schedules:
- cron: '0 6 * * 1'   # Mondays 06:00 UTC: weekly evidence even without commits
  displayName: 'Weekly FedRAMP 20x scan'
  branches:
    include: [main]
  always: true

parameters:
- name: failOn
  displayName: 'Fail the build on issues at or above'
  type: string
  default: high
  values: [critical, high, medium, low, none]
- name: rulesSource
  displayName: 'Rules source (live = latest FedRAMP/rules, bundled = pinned snapshot)'
  type: string
  default: live
  values: [live, bundled]
- name: uploadEvidence
  displayName: 'Upload scan output to evidence storage'
  type: boolean
  default: true
- name: evidenceDryRun
  displayName: 'Evidence dry run (stage and list only)'
  type: boolean
  default: false
- name: evidencePool
  displayName: 'Agent pool with private network reach to the evidence account'
  type: string
  default: 'intelli-pool-1'

variables:
  scanArtifact: 'fedramp-scan'

stages:
- stage: Scan
  displayName: 'FedRAMP 20x scan'
  jobs:
  - job: scan
    displayName: 'Pattern scan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 1
    - template: templates/fedramp-scan-steps.yml
      parameters:
        scanPath: '$(Build.SourcesDirectory)'
        failOn: ${{ parameters.failOn }}
        rulesSource: ${{ parameters.rulesSource }}
        artifactName: $(scanArtifact)
        # The repo's own test fixtures and templates are deliberate examples
        # of non-compliant code; scanning them only adds noise.
        excludes:
        - 'tests/*'
        - 'src/fedramp_20x_mcp/templates/*'
        - 'examples/*'

- ${{ if eq(parameters.uploadEvidence, true) }}:
  - stage: StoreEvidence
    displayName: 'Store evidence'
    dependsOn: Scan
    condition: and(not(canceled()), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
    - job: upload
      displayName: 'Upload to evidence storage'
      pool: ${{ parameters.evidencePool }}
      steps:
      - checkout: none
      - download: current
        artifact: $(scanArtifact)
      - template: templates/evidence-upload-steps.yml
        parameters:
          sourceDir: '$(Pipeline.Workspace)/$(scanArtifact)'
          reportName: 'fedramp20x-scan/$(Build.Repository.Name)'
          dryRun: ${{ parameters.evidenceDryRun }}
